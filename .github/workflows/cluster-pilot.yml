name: Bazhi cluster pilot
on:
  push:
    branches: [codex/bazhi-cluster-pilot]
    paths: [cluster/**, .github/workflows/cluster-pilot.yml]
  pull_request:
    paths: [cluster/**, .github/workflows/cluster-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-and-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: pilot_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: cluster
    env:
      TEST_DATABASE_URL: postgresql://pilot:synthetic-test-only@localhost:5432/pilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cluster/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile and validate Docker configuration
        run: |
          python -m compileall -q .
          python configure.py
          docker compose config --quiet
      - name: Regression and concurrency tests
        run: python -m unittest discover -v -p "test_*.py"
      - name: Queue benchmark without SMTP
        run: python benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-queue-report
          path: cluster/pilot-report.json
